---
# tasks file for playbooks/roles/ocp-kdump

# Check the health of Cluster Operators
- name: Check if cluster operators and nodes are healthy
  include_role:
    name: check-cluster-health

- name: Ensure Butane is installed
  package:
    name: butane
    state: present

- name: Check Butane version
  command: butane --version
  register: butane_check
  failed_when: butane_check.rc != 0

- name: Ensure kexec-tools is installed
  package:
    name: kexec-tools
    state: present

- name: Create Butane config file
  copy:
    dest: "/tmp/99-worker-kdump.bu"
    mode: '0644'
    content: |
      variant: openshift
      version: 4.18.0
      metadata:
        name: 99-worker-kdump
        labels:
          machineconfiguration.openshift.io/role: worker
      openshift:
        kernel_arguments:
          - crashkernel=2G-4G:384M,4G-16G:512M,16G-64G:1G,64G-128G:2G,128G-:4G
      storage:
        files:
          - path: /etc/kdump.conf
            mode: 0644
            overwrite: true
            contents:
              inline: |
                path /var/crash
                core_collector makedumpfile -l --message-level 7 -d 31
          - path: /etc/sysconfig/kdump
            mode: 0644
            overwrite: true
            contents:
              inline: |
                KDUMP_COMMANDLINE_REMOVE="hugepages hugepagesz slub_debug quiet log_buf_len swiotlb"
                KDUMP_COMMANDLINE_APPEND="irqpoll maxcpus=1 reset_devices cgroup_disable=memory mce=off numa=off udev.children-max=2 panic=10 rootflags=nofail acpi_no_memhotplug transparent_hugepage=never nokaslr novmcoredd hest_disable"
                KEXEC_ARGS="-s"
                KDUMP_IMG="vmlinuz"
      systemd:
        units:
          - name: kdump.service
            enabled: true

- name: Generate MachineConfig YAML using Butane
  command: "butane /tmp/99-worker-kdump.bu -o /tmp/99-worker-kdump.yaml"
  args:
    creates: "/tmp/99-worker-kdump.yaml"

- name: Apply MachineConfig to the OpenShift cluster
  command: "oc apply -f /tmp/99-worker-kdump.yaml"

# Wait for MCO to start rendering/applying the new config
- name: Wait for MachineConfigPool worker to start updating
  shell: |
    oc get mcp worker -o jsonpath='{.status.conditions[?(@.type=="Updating")].status}'
  register: mcp_updating
  retries: 10
  delay: 30
  until: mcp_updating.stdout == "True"

# Wait for MCO to finish applying - nodes will reboot during this
- name: Wait for MachineConfigPool worker to finish updating
  shell: |
    oc get mcp worker -o jsonpath='{.status.conditions[?(@.type=="Updated")].status}'
  register: mcp_updated
  retries: 30
  delay: 60
  until: mcp_updated.stdout == "True"

# Ensure MachineConfigPool is not degraded
- name: Ensure MachineConfigPool worker is not degraded
  shell: |
    oc get mcp worker -o jsonpath='{.status.conditions[?(@.type=="Degraded")].status}'
  register: mcp_degraded
  retries: 10
  delay: 30
  until: mcp_degraded.stdout == "False"
  failed_when: mcp_degraded.stdout == "True"

# Wait for all worker nodes to be Ready after MCO reboot
- name: Wait until all worker nodes are in Ready state
  shell: |
    oc get nodes --selector='node-role.kubernetes.io/worker' --no-headers | \
    awk '{print $2}' | grep -v '^Ready$' || true
  register: worker_nodes_ready
  retries: 20
  delay: 30
  until: worker_nodes_ready.stdout == ""

- name: Wait for system to settle
  pause:
    seconds: 60

# Check kdump status on worker node via oc debug
- name: Check kdump status on worker node
  shell: >
    oc debug node/{{ worker_node | trim }} -- chroot /host bash -c 'kdumpctl status'
  register: kdump_status_output
  failed_when: false

- name: Debug kdump status
  debug:
    var: kdump_status_output.stdout_lines

- name: Fail if kdump is not operational
  fail:
    msg: "Kdump is NOT operational. Current status: {{ kdump_status_output.stdout }}"
  when: "'active' not in kdump_status_output.stdout"

# Validate /etc/sysconfig/kdump on worker node via oc debug
- name: Validate essential keys exist in /etc/sysconfig/kdump on worker node
  shell: >
    oc debug node/{{ worker_node | trim }} -- chroot /host bash -c
    'grep -q "^KDUMP_COMMANDLINE_APPEND=" /etc/sysconfig/kdump &&
     grep -q "^KDUMP_COMMANDLINE_REMOVE=" /etc/sysconfig/kdump &&
     grep -q "^KEXEC_ARGS=" /etc/sysconfig/kdump &&
     grep -q "^KDUMP_IMG=" /etc/sysconfig/kdump'
  register: sysconfig_kdump_check
  failed_when: sysconfig_kdump_check.rc != 0

# Validate /etc/kdump.conf on worker node via oc debug
- name: Validate /etc/kdump.conf contents on worker node
  shell: >
    oc debug node/{{ worker_node | trim }} -- chroot /host bash -c
    'grep -q "^path /var/crash" /etc/kdump.conf &&
     grep -q "core_collector makedumpfile" /etc/kdump.conf'
  register: kdump_conf_check
  failed_when: kdump_conf_check.rc != 0

# Trigger crash up to 10 times to account for logs not being generated on every run.
- name: Repeat crash trigger 10 times with pauses
  include_tasks: crash_trigger.yml
  loop: "{{ range(1, 11) | list }}"
  loop_control:
    label: "Crash iteration {{ item }}"